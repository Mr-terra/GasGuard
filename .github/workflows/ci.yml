# Runs `make check` on every push to main, and on demand on other branches
# (Actions tab, or a tag `ci-*`).
name: ci

on:
  push:
    branches: [main]
    tags: ['ci-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # Pinned: a newer runner changes the analyser versions (cppcheck, clang-tidy, gcc).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-avr avr-libc binutils-avr \
            cppcheck clang-tidy gcovr python3-pip
          sudo python3 -m pip install lizard==1.24.3

      - name: make check
        run: make check
